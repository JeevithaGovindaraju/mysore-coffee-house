<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ಮೈಸೂರು ಕಾಫಿ ಮನೆ — a Kannada evergreen radio</title>
<meta name="description" content="Pull up a chair at the Mysuru Coffee House: an always-on radio playing Kannada evergreen classics beneath a lit-up Mysore Palace skyline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700&family=Noto+Serif+Kannada:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#0d2436;
    --sky-mid:#1b3f56;
    --sky-glow:#8a4a3a;
    --palace-gold:#e0a94a;
    --palace-gold-dim:#a97a34;
    --coffee-dark:#241209;
    --coffee-mid:#3c2013;
    --cream:#f4e6c9;
    --cream-dim:#d8c49f;
    --ember:#e2793f;
    --brass:#c9973f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--sky-top);overflow:hidden;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--cream);
    position:relative;
    min-height:100vh;
    width:100%;
  }
  .scene{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 30%, rgba(224,169,74,0.18), transparent 70%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, #2d3a2e 78%, var(--coffee-dark) 100%);
  }
  .stars{position:fixed;inset:0;pointer-events:none;transition:opacity 1.2s ease;}
  body.time-afternoon .stars{opacity:0;}
  body.time-morning .stars{opacity:.35;}
  .stars span{
    position:absolute;width:2px;height:2px;background:var(--cream);
    border-radius:50%;opacity:.5;animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

  /* Mysore Palace silhouette */
  .palace{position:fixed;left:0;right:0;bottom:26vh;height:34vh;z-index:1;}
  .palace svg{width:100%;height:100%;display:block;}
  .palace-glow{
    position:fixed;left:0;right:0;bottom:26vh;height:20vh;z-index:0;
    background:radial-gradient(ellipse 45% 100% at 50% 100%, rgba(224,169,74,0.25), transparent 75%);
  }

  /* foreground coffee house */
  .foreground{position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:3;}
  .foreground svg{width:100%;height:100%;display:block;}

  .vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 55%, transparent 40%, rgba(6,10,14,0.55) 100%);
  }

  /* ===== Rain overlay =====
     A simple animated rain-streak layer shown whenever rain mode is on,
     regardless of whether the backdrop is the SVG illustration, a photo,
     or a video. Works as a tasteful default even before any rain-specific
     artwork has been generated for a given time slot. */
  .rain-overlay{
    position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
    transition:opacity .6s ease;
    background-image:repeating-linear-gradient(
      100deg,
      rgba(200,220,235,0.16) 0px, rgba(200,220,235,0.16) 1px,
      transparent 1px, transparent 14px
    );
    background-size:120% 220%;
    animation:rainfall .55s linear infinite;
  }
  body.rain-mode .rain-overlay{opacity:.55;}
  @keyframes rainfall{
    0%{background-position:0 -20%;}
    100%{background-position:-6% 100%;}
  }

  /* ===== Drop-in media layer =====
     By default the hand-drawn SVG scene (.scene-fallback) shows.
     Set MEDIA.type to 'image' or 'video' in the script below to swap it
     for a generated illustration/loop instead — no other changes needed. */
  .scene-image,.scene-video{
    display:none;position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:0;
  }
  body.media-image .scene-fallback{display:none;}
  body.media-image .scene-image{display:block;}
  body.media-video .scene-fallback{display:none;}
  body.media-video .scene-video{display:block;}

  /* ===== Time-of-day vibe wash =====
     Sits over whatever backdrop is showing (illustration, image, or video)
     and tints it to match the time of day. Purely a color wash — it never
     hides the artwork, just shifts its mood. */
  .time-wash{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    transition:background 1.2s ease, opacity 1.2s ease;
  }
  body.time-morning .time-wash{background:#a9d0e8;opacity:.24;mix-blend-mode:soft-light;}
  body.time-afternoon .time-wash{background:#ffdb94;opacity:.16;mix-blend-mode:soft-light;}
  body.time-evening .time-wash{background:#e0a94a;opacity:.16;mix-blend-mode:overlay;}
  body.time-night .time-wash{background:#0a1425;opacity:.48;mix-blend-mode:multiply;}

  /* accent color drifts slightly with the time of day too */
  body.time-morning{--ember:#5fa3c9;--brass:#7fb8d4;--knob-glow:2px;}
  body.time-afternoon{--ember:#e8973f;--brass:#d9a24f;--knob-glow:0px;}
  body.time-evening{--ember:#e2793f;--brass:#c9973f;--knob-glow:6px;}
  body.time-night{--ember:#8a6bd1;--brass:#6f5aa8;--knob-glow:10px;}

  .period-label{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brass);margin:0 0 6px;opacity:.85;
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 24px;
  }
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:.04em;color:var(--cream-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ember);
    box-shadow:0 0 8px var(--ember);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .mark{display:flex;flex-direction:column;gap:3px;}
  .mark-title{font-family:'Noto Serif Kannada',serif;font-weight:600;font-size:15px;
    color:var(--cream);margin:0;letter-spacing:.01em;}
  .mark-meta{display:flex;align-items:center;gap:6px;font-size:11px;
    color:var(--cream-dim);margin:0;letter-spacing:.03em;}
  .icon-link{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(244,230,201,0.25);background:rgba(20,14,10,0.35);
    color:var(--cream-dim);transition:all .2s ease;backdrop-filter:blur(4px);
  }
  .icon-link:hover{background:rgba(244,230,201,0.14);border-color:rgba(244,230,201,0.6);color:var(--cream);}
  .icon-link svg{fill:currentColor;}
  .icon-link.active{background:rgba(95,163,201,0.28);border-color:rgba(95,163,201,0.7);color:#dff0fa;}
  .links{display:flex;gap:10px;}

  main{
    position:relative;z-index:10;
  }

  .player-dock{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:11;
    width:min(94vw,720px);display:flex;flex-direction:column;align-items:center;
  }
  .queue-toggle{
    display:flex;align-items:center;justify-content:center;gap:5px;
    padding:5px 16px;margin-bottom:6px;
    background:rgba(20,12,9,0.6);border:1px solid rgba(224,169,74,0.22);
    border-radius:999px;color:var(--cream-dim);font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;cursor:pointer;transition:color .15s ease,background .15s ease;
  }
  .queue-toggle:hover{color:var(--cream);background:rgba(224,169,74,0.1);}
  .queue-toggle svg{width:11px;height:11px;fill:currentColor;transition:transform .25s ease;}
  .queue-toggle.open svg{transform:rotate(180deg);}
  .queue-panel{
    width:100%;max-height:0;overflow:hidden;opacity:0;
    background:rgba(20,12,9,0.82);border:1px solid rgba(224,169,74,0.2);
    border-radius:18px;margin-bottom:0;
    transition:max-height .3s ease, opacity .25s ease, margin .3s ease;
    backdrop-filter:blur(10px);
  }
  .queue-panel.open{max-height:280px;opacity:1;margin-bottom:8px;overflow-y:auto;}
  .queue-item{
    display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
    border-bottom:1px solid rgba(244,230,201,0.06);transition:background .15s ease;
  }
  .queue-item:last-child{border-bottom:none;}
  .queue-item:hover{background:rgba(244,230,201,0.06);}
  .queue-item.active{background:rgba(224,169,74,0.14);}
  .queue-item .qi-num{font-size:11px;color:var(--brass);flex:none;width:14px;text-align:center;}
  .queue-item img{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;}
  .queue-item .qi-text{flex:1;min-width:0;}
  .queue-item .qi-title{font-size:12.5px;color:var(--cream);margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .queue-item .qi-artist{font-size:10.5px;color:var(--cream-dim);margin:1px 0 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .player{
    width:100%;
    background:linear-gradient(135deg, rgba(58,35,20,0.75), rgba(20,12,9,0.75));
    border:1px solid rgba(224,169,74,0.22);
    border-radius:999px;
    padding:10px 14px 10px 10px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    display:flex;align-items:center;gap:14px;
  }
  .thumb-wrap{
    position:relative;flex:none;width:56px;height:56px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(224,169,74,0.3);background:var(--coffee-mid);
  }
  .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(1.05);transition:opacity .4s ease;}
  .track-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .eyebrow{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:0;}
  .track-title{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;color:var(--cream);
    margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-artist{font-size:12px;color:var(--cream-dim);margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .controls-row{display:flex;align-items:center;justify-content:flex-end;gap:22px;flex:none;padding-right:4px;}
  .play-btn{
    flex:none;width:52px;height:52px;border-radius:50%;
    background:var(--cream);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    transition:transform .15s ease;
  }
  .play-btn:hover{transform:scale(1.06);}
  .play-btn svg{width:19px;height:19px;fill:var(--coffee-dark);margin-left:2px;}
  .side-btn{
    flex:none;width:26px;height:26px;background:transparent;
    border:none;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;color:var(--cream-dim);
    transition:color .15s ease,transform .15s ease;
  }
  .side-btn:hover{color:var(--cream);transform:scale(1.08);}
  .side-btn svg{width:20px;height:20px;fill:currentColor;}

  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-track{
    flex:1;max-width:280px;position:relative;height:14px;display:flex;align-items:center;cursor:pointer;
  }
  .progress-track::before{
    content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:4px;background:rgba(244,230,201,0.2);border-radius:2px;
  }
  .progress-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:4px;width:0%;background:var(--cream);border-radius:2px;pointer-events:none;}
  .progress-knob{
    position:absolute;top:50%;left:0%;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #fff8e8, var(--brass) 78%);
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px rgba(20,12,9,0.4), 0 0 var(--knob-glow,4px) calc(var(--knob-glow,4px) * 0.7) var(--ember);
    pointer-events:none;transition:left .12s linear, box-shadow 1.2s ease;
  }
  .time{font-size:12px;color:var(--cream-dim);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em;}

  #yt-player{position:fixed;width:320px;height:180px;left:-9999px;top:-9999px;opacity:0;pointer-events:none;}

  footer{
    position:fixed;bottom:20px;right:20px;z-index:10;text-align:right;
    font-size:11px;color:rgba(244,230,201,0.4);letter-spacing:.03em;
    max-width:200px;
  }
  footer a{color:inherit;}
  @media (max-width:640px){
    footer{display:none;}
  }

  @media (max-width:520px){
    .palace{bottom:24vh;height:30vh;}
    .foreground{height:28vh;}
    .player-dock{bottom:12px;width:calc(100vw - 20px);}
    .player{gap:10px;padding:8px 10px 8px 8px;}
    .thumb-wrap{width:46px;height:46px;border-radius:11px;}
    .controls-row{gap:14px;}
    .play-btn{width:44px;height:44px;}
    .progress-track{max-width:120px;}
    .time{display:none;}
    .mark-title{font-size:13px;}
    .mark-meta{font-size:10px;}
  }
</style>
</head>
<body>

<div class="scene-fallback">
<div class="scene"></div>
<div class="stars" id="stars"></div>
<div class="palace-glow"></div>

<div class="palace">

      <rect x="555" y="120" width="90" height="80"/>

    <!-- glowing windows -->
    <g fill="#f0b95c">

      <rect x="596" y="100" width="8" height="14" rx="2" opacity="0.9"/>
    </g>
    <!-- string lights along the base -->
    <g fill="#f7c873" opacity="0.85">
      <circle cx="260" cy="322" r="2.4"/><circle cx="300" cy="324" r="2.4"/>
      <circle cx="340" cy="322" r="2.4"/><circle cx="380" cy="324" r="2.4"/>
      <circle cx="420" cy="322" r="2.4"/><circle cx="460" cy="324" r="2.4"/>
      <circle cx="700" cy="324" r="2.4"/><circle cx="740" cy="322" r="2.4"/>
      <circle cx="780" cy="324" r="2.4"/><circle cx="820" cy="322" r="2.4"/>
      <circle cx="860" cy="324" r="2.4"/><circle cx="900" cy="322" r="2.4"/>
    </g>
  </svg>
</div>

<div class="foreground">
  <svg viewBox="0 0 1200 340" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <!-- coffee house verandah silhouette -->
    <g fill="#150a04">
      <rect x="0" y="0" width="1200" height="340"/>
    </g>
    <!-- awning -->
    <g fill="#2c1810">
      <path d="M0 40 L1200 40 L1200 20 Q600 -10 0 20 Z"/>
    </g>
    <!-- hanging bulbs from awning -->
    <g>
      <line x1="120" y1="40" x2="120" y2="62" stroke="#3a2214" stroke-width="2"/>

    <!-- counter -->
    <g fill="#241206">
      <rect x="0" y="230" width="1200" height="20"/>

    </g>
    <g fill="#3c2313">
      <rect x="40" y="235" width="1120" height="8"/>

    <!-- vintage stereo / radio cabinet, centered -->
    <g transform="translate(560,120)">

      <g id="wave" stroke="#f0b95c" stroke-width="2.4" fill="none" opacity="0.85">

</div><!-- /.scene-fallback -->

<img class="scene-image" id="scene-image" alt="">
<video class="scene-video" id="scene-video" muted loop playsinline autoplay></video>
<div class="time-wash"></div>

<div class="rain-overlay"></div>
<div class="vignette"></div>

<header>
  <div class="mark">
    <p class="mark-title">☕ ಮೈಸೂರು ಕಾಫಿ ಮನೆ</p>
    <p class="mark-meta"><span id="track-count">4 Tracks</span> · <span id="period-label">Evening</span></p>
    <p class="mark-meta"><span class="dot"></span><span id="listener-count">— at the counter</span></p>
  </div>
  <div class="links">

<script>
// ===== Backdrop media config, by time of day =====
// Leave any slot's type as 'illustration' to keep the hand-drawn SVG scene
// for that period. Once you've generated artwork for a time of day, fill
// in its src (and set type to 'image' or 'video'). Files should sit in the
// same folder as this HTML file.
//
//   morning   ~5am–11am   dawn light, mist, quiet street
//   afternoon ~11am–5pm   bright daylight, full sun
//   evening   ~5pm–8pm    golden hour, lights just coming on (current default look)
//   night     ~8pm–5am    palace fully lit, deep dark sky
//
// Each period also has a "rain" variant — shown only when the person taps
// the rain toggle button. It still respects whatever time of day it actually
// is (morning rain vs night rain), it just swaps in the wet-weather artwork
// for that same period. Leave rain.src empty to fall back to a simple
// animated rain overlay on top of the normal illustration/image.
//
// Example once you have files:
//   morning: { type:'image', src:'mysore-morning.jpg', rain:{ type:'image', src:'mysore-morning-rain.jpg' } },

const MEDIA_BY_TIME = {
  morning:   { type:'image', src:'morn1.png',   rain:{ type:'image', src:'morn2.png' } },
  afternoon: { type:'image', src:'noon1.png', rain:{ type:'image', src:'noon2.png' } },
  evening:   { type:'image', src:'even1.png',   rain:{ type:'image', src:'enen2.png' } },
  night:     { type:'image', src:'nig1.png',     rain:{ type:'image', src:'nig2.png' } }
};

const PERIOD_LABELS = {
  morning:'Morning · ಬೆಳಗ್ಗೆ',
  afternoon:'Afternoon · ಮಧ್ಯಾಹ್ನ',
  evening:'Evening · ಸಂಜೆ',
  night:'Night · ರಾತ್ರಿ'
};

function getPeriod(){
  // preview override for testing: open the file with ?time=morning / afternoon / evening / night
  const forced=new URLSearchParams(location.search).get('time');
  if(forced && MEDIA_BY_TIME[forced]) return forced;
  const h=new Date().getHours();
  if(h>=5 && h<11) return 'morning';
  if(h>=11 && h<17) return 'afternoon';
  if(h>=17 && h<20) return 'evening';
  return 'night';
}

let rainMode=false;
let currentPeriod=null;
function applyMedia(){
  const period=getPeriod();
  if(period===currentPeriod && !applyMedia._forceNext) return; // no change, leave audio/visuals alone
  applyMedia._forceNext=false;
  currentPeriod=period;

  document.body.classList.remove('time-morning','time-afternoon','time-evening','time-night','media-image','media-video');
  document.body.classList.add('time-'+period);
  document.getElementById('period-label').textContent=PERIOD_LABELS[period]+(rainMode?' · Rain':'');

  const base=MEDIA_BY_TIME[period];
  const m=(rainMode && base.rain && base.rain.src) ? base.rain : base;
  if(m.type==='image' && m.src){
    document.body.classList.add('media-image');
    document.getElementById('scene-image').src=m.src;
  } else if(m.type==='video' && m.src){
    document.body.classList.add('media-video');
    const v=document.getElementById('scene-video');
    v.src=m.src;
    v.play().catch(()=>{}); // autoplay may need a user gesture on some browsers
  }
}
applyMedia();
setInterval(applyMedia, 5*60*1000); // recheck every 5 min in case the tab stays open across a boundary

// starfield
(function(){
  const el=document.getElementById('stars');
  let html='';
  for(let i=0;i<70;i++){
    const x=Math.random()*100, y=Math.random()*45, d=2+Math.random()*3, delay=Math.random()*4;
    html+=`<span style="left:${x}%;top:${y}%;animation-duration:${d}s;animation-delay:${delay}s"></span>`;
  }
  el.innerHTML=html;
})();

// fake live listener count, ambient
(function(){
  const elc=document.getElementById('listener-count');
  let n=Math.floor(180+Math.random()*140);
  function render(){ elc.textContent=n.toLocaleString('en-IN')+' at the counter'; }
  render();
  setInterval(()=>{
    n=Math.max(60,n+Math.floor(Math.random()*9-4));
    render();
  },4000);
})();

// playlists: curated from the Kannada evergreen Spotify playlist, matched to YouTube for playback
// Split into 4 moods by time of day — edit any list freely, or paste in a totally different
// set of songs for a given period (see instructions below).
const PLAYLIST_BY_TIME = {
  morning: [
    {id:'4TNDaSViIXU', title:'ನಗು ಎಂದಿದೆ', artist:'S. Janaki'},
    {id:'63dI_hBY00M', title:'ನಗುವ ನಯನ', artist:'S.P. Balasubrahmanyam, S. Janaki'},
    {id:'m4M6EfwEYUo', title:'ನಲಿವ ಗುಲಾಬಿ ಹೂವೆ', artist:'S.P. Balasubrahmanyam'},
    {id:'sfcMnZG_mYg', title:'ಪ್ರೇಮಲೋಕದಿಂದ ಬಂದ', artist:'K.J. Yesudas, S. Janaki'},
    {id:'VlOJwpdMcxg', title:'ಮನೆಯನ್ನು ಬೆಳಗಿದೆ', artist:'S.P. Balasubrahmanyam, S. Janaki'}
  ],
  afternoon: [
    {id:'NBBC8JtDrK8', title:'ಜೊತೆಯಲಿ ಜೊತೆ ಜೊತೆಯಲಿ', artist:'S.P. Balasubrahmanyam, S. Janaki'},
    {id:'37nuscfhYt4', title:'ಈ ಭೂಮಿ ಬಣ್ಣದ ಬುಗುರಿ', artist:'S.P. Balasubrahmanyam'},
    {id:'QLfSfwrEz8I', title:'ಸಂತೋಷಕ್ಕೆ ಹಾಡು ಸಂತೋಷಕ್ಕೆ', artist:'S.P. Balasubrahmanyam'},
    {id:'MFgEj07lntA', title:'ಕಲ್ಲಾದರೆ ನಾನು', artist:'S.P. Balasubrahmanyam'}
  ],
  evening: [
    {id:'dSqQkqqq8fM', title:'ಹುಟ್ಟಿದರೆ ಕನ್ನಡ ನಾಡಲ್ಲಿ', artist:'Dr. Rajkumar'},
    {id:'EkPOkT_a2U0', title:'ನಾದಮಯ ಈ ಲೋಕವೆಲ್ಲ', artist:'Dr. Rajkumar'},
    {id:'-PApfvAv0AA', title:'ಚೆಲುವೆಯೇ ನಿನ್ನ', artist:'Dr. Rajkumar, S. Janaki'},
    {id:'ahynUoaqlmo', title:'ಬೆಳದಿಂಗಳಾಗಿ ಬಾ', artist:'Dr. Rajkumar'},
    {id:'4kynUE1XJws', title:'ಬೆಳ್ಳಿ ಕಾಲುಂಗುರ', artist:'S. Janaki, Chitra'}
  ],
  night: [
    {id:'z2o6MSWDw4I', title:'ಆ ಕರ್ಣನಂತೆ', artist:'K.J. Yesudas'},
    {id:'CJjWR3-DggM', title:'ನಾ ನಿನ್ನ ಮರೆಯಲಾರೆ', artist:'Dr. Rajkumar, S. Janaki'},
    {id:'M3ecud1gY5Q', title:'ಪ್ರೀತಿ ಮಾಡಬಾರದು', artist:'S.P. Balasubrahmanyam, S. Janaki'},
    {id:'nyzsuY8q7QY', title:'ಹಾಲು ಜೇನು', artist:'Dr. Rajkumar'},
    {id:'vZQHvKZZZeU', title:'ನಿನ್ನ ನಗುವು ಹೂವಂತೆ', artist:'S.P. Balasubrahmanyam, S. Janaki'}
  ]
};

// A single mood playlist used whenever rain mode is on, regardless of what
// time of day it is — swap in whatever moody/rainy-day songs you like here,
// same {id, title, artist} format as above.
const RAIN_PLAYLIST=[
  {id:'z2o6MSWDw4I', title:'ಆ ಕರ್ಣನಂತೆ', artist:'K.J. Yesudas'},
  {id:'M3ecud1gY5Q', title:'ಪ್ರೀತಿ ಮಾಡಬಾರದು', artist:'S.P. Balasubrahmanyam, S. Janaki'},
  {id:'sfcMnZG_mYg', title:'ಪ್ರೇಮಲೋಕದಿಂದ ಬಂದ', artist:'K.J. Yesudas, S. Janaki'},
  {id:'nyzsuY8q7QY', title:'ಹಾಲು ಜೇನು', artist:'Dr. Rajkumar'}
];

function activePlaylist(){
  return rainMode ? RAIN_PLAYLIST : PLAYLIST_BY_TIME[currentPeriod || getPeriod()];
}

let playlist=activePlaylist();
let idx=Math.floor(Math.random()*playlist.length);
let player, ready=false, playing=false, progressTimer;

function fmt(t){
  t=Math.max(0,Math.floor(t));
  const m=Math.floor(t/60), s=t%60;
  return m+':'+(s<10?'0':'')+s;
}

// ===== Queue / "Up next" panel =====
const queueToggle=document.getElementById('queue-toggle');
const queuePanel=document.getElementById('queue-panel');
function closeQueue(){ queuePanel.classList.remove('open'); queueToggle.classList.remove('open'); }
queueToggle.addEventListener('click',()=>{
  queuePanel.classList.toggle('open');
  queueToggle.classList.toggle('open');
});

function renderQueue(){
  queuePanel.innerHTML=playlist.map((tr,i)=>`
    <div class="queue-item${i===idx?' active':''}" data-idx="${i}">
      <span class="qi-num">${i+1}</span>
      <img src="https://i.ytimg.com/vi/${tr.id}/hqdefault.jpg" alt="">
      <div class="qi-text">
        <p class="qi-title">${tr.title}</p>
        <p class="qi-artist">${tr.artist}</p>
      </div>
    </div>
  `).join('');
  queuePanel.querySelectorAll('.queue-item').forEach(el=>{
    el.addEventListener('click',()=>{
      idx=parseInt(el.dataset.idx,10);
      loadTrack(idx,true);
      closeQueue();
    });
  });
}

function syncPlaylistUI(){
  document.getElementById('track-count').textContent=playlist.length+(playlist.length===1?' Track':' Tracks');
  renderQueue();
}
syncPlaylistUI();

// ===== Rain mode toggle =====
// Swaps the playlist to RAIN_PLAYLIST and the backdrop to that time period's
// "rain" media variant. Doesn't change currentPeriod — the picture still
// respects whatever time of day it actually is, just shows the wet-weather
// version of it. Keeps playing/paused state as it was.
const rainToggle=document.getElementById('rain-toggle');
rainToggle.addEventListener('click',()=>{
  rainMode=!rainMode;
  document.body.classList.toggle('rain-mode', rainMode);
  rainToggle.classList.toggle('active', rainMode);

  playlist=activePlaylist();
  idx=0;
  syncPlaylistUI();
  loadTrack(idx, playing); // keep playing if it already was, stay paused if it wasn't

  applyMedia._forceNext=true;
  applyMedia();
});

// re-check every 5 min in case the tab stays open across a time-of-day boundary.
// switches the *pool* used for the next/prev song — doesn't cut off whatever's playing now.
// skipped while rain mode is on, since that uses its own fixed playlist regardless of time.
setInterval(()=>{
  const p=getPeriod();
  if(p!==currentPeriod){
    currentPeriod=p;
    if(!rainMode){
      playlist=PLAYLIST_BY_TIME[p];
      idx=0;
      syncPlaylistUI();
    }
    applyMedia._forceNext=true;
    applyMedia();
  }
},5*60*1000);

function loadTrack(i, autoplay){
  const tr=playlist[i];
  document.getElementById('track-title').textContent=tr.title;
  document.getElementById('track-artist').textContent=tr.artist;
  document.getElementById('thumb').src='https://i.ytimg.com/vi/'+tr.id+'/hqdefault.jpg';
  document.getElementById('status-text').textContent='Tuning in…';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('progress-knob').style.left='0%';
  document.getElementById('time').textContent='0:00 / 0:00';
  renderQueue();
  if(ready){
    if(autoplay){ player.loadVideoById(tr.id); }
    else { player.cueVideoById(tr.id); }
  }
}

function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{
    height:'1',width:'1',videoId:playlist[idx].id,
    playerVars:{ autoplay:0, controls:0 },
    events:{
      onReady:function(){
        ready=true;
        loadTrack(idx,false);
      },
      onStateChange:function(e){
        if(e.data===YT.PlayerState.PLAYING){
          playing=true;
          document.getElementById('status-text').textContent='Now playing';
          setPlayIcon(true);
          startProgress();
        } else if(e.data===YT.PlayerState.PAUSED){
          playing=false;
          setPlayIcon(false);
          stopProgress();
        } else if(e.data===YT.PlayerState.ENDED){
          next();
        }
      },
      onError:function(e){
        // 101/150 = embedding disabled by uploader, 100 = video removed/private
        console.warn('Track failed to play (code '+e.data+'), skipping:', playlist[idx].id);
        document.getElementById('status-text').textContent='Skipping — unavailable';
        setTimeout(next, 900);
      }
    }
  });
}
const tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.body.appendChild(tag);

function setPlayIcon(isPlaying){
  const icon=document.getElementById('play-icon');
  icon.innerHTML=isPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function startProgress(){
  stopProgress();
  progressTimer=setInterval(()=>{
    if(!ready||!player.getDuration||seeking) return;
    const cur=player.getCurrentTime()||0, dur=player.getDuration()||0;
    const pct=dur?(cur/dur*100):0;
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('progress-knob').style.left=pct+'%';
    document.getElementById('time').textContent=fmt(cur)+' / '+fmt(dur);
  },500);
}
function stopProgress(){ clearInterval(progressTimer); }

function next(){
  idx=(idx+1)%playlist.length;
  loadTrack(idx,true);
}
function prev(){
  idx=(idx-1+playlist.length)%playlist.length;
  loadTrack(idx,true);
}

document.getElementById('play-btn').addEventListener('click',()=>{
  if(!ready) return;
  if(playing){ player.pauseVideo(); } else { player.playVideo(); }
});
document.getElementById('next-btn').addEventListener('click',next);
document.getElementById('prev-btn').addEventListener('click',prev);

// seekable progress bar — click or drag anywhere on the track
let seeking=false;
const track=document.getElementById('progress-track');
function seekTo(clientX){
  if(!ready||!player.getDuration) return;
  const rect=track.getBoundingClientRect();
  const pct=Math.min(1,Math.max(0,(clientX-rect.left)/rect.width));
  const dur=player.getDuration()||0;
  document.getElementById('progress-fill').style.width=(pct*100)+'%';
  document.getElementById('progress-knob').style.left=(pct*100)+'%';
  document.getElementById('time').textContent=fmt(pct*dur)+' / '+fmt(dur);
  player.seekTo(pct*dur, true);
}
track.addEventListener('mousedown',(e)=>{ seeking=true; seekTo(e.clientX); });
window.addEventListener('mousemove',(e)=>{ if(seeking) seekTo(e.clientX); });
window.addEventListener('mouseup',()=>{ seeking=false; });
track.addEventListener('touchstart',(e)=>{ seeking=true; seekTo(e.touches[0].clientX); },{passive:true});
track.addEventListener('touchmove',(e)=>{ if(seeking) seekTo(e.touches[0].clientX); },{passive:true});
window.addEventListener('touchend',()=>{ seeking=false; });
</script>
